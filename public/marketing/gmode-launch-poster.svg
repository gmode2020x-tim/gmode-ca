<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">GMODE Trip Recorder launch poster</title>
  <desc id="desc">Dark launch poster for GMODE Trip Recorder with route lines and Google Play launch list message.</desc>
  <rect width="1080" height="1350" fill="#02070d"/>
  <path d="M-80 240 C180 30 320 360 540 210 S890 120 1160 260" fill="none" stroke="#17324a" stroke-width="2"/>
  <path d="M-60 960 C180 720 360 1030 580 820 S870 750 1140 930" fill="none" stroke="#17324a" stroke-width="2"/>
  <path d="M140 1100 C250 860 420 940 520 690 C620 440 770 520 890 270" fill="none" stroke="#1992ff" stroke-width="18" stroke-linecap="round"/>
  <path d="M260 300 C405 410 365 565 530 620 C710 680 680 875 870 970" fill="none" stroke="#69d43f" stroke-width="14" stroke-linecap="round"/>
  <circle cx="140" cy="1100" r="26" fill="#02070d" stroke="#1992ff" stroke-width="12"/>
  <circle cx="870" cy="970" r="22" fill="#02070d" stroke="#69d43f" stroke-width="10"/>
  <g transform="translate(78 82)">
    <rect width="58" height="58" rx="14" fill="#0a1722" stroke="#1992ff" stroke-width="4"/>
    <text x="29" y="39" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#1992ff">G</text>
    <text x="78" y="25" font-family="Arial, sans-serif" font-size="31" font-weight="900" fill="#f5f9ff">GMODE</text>
    <text x="78" y="55" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#9fb0bd">Trip Recorder</text>
  </g>
  <text x="78" y="330" font-family="Arial, sans-serif" font-size="96" font-weight="900" fill="#f5f9ff">Every route,</text>
  <text x="78" y="430" font-family="Arial, sans-serif" font-size="96" font-weight="900" fill="#f5f9ff">sorted.</text>
  <text x="78" y="525" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#1992ff">Street.</text>
  <text x="245" y="525" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#69d43f">Off road.</text>
  <text x="480" y="525" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#b9ecff">Snow.</text>
  <text x="645" y="525" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#41d5ff">Water.</text>
  <text x="78" y="620" font-family="Arial, sans-serif" font-size="34" fill="#c4d0da">Clean trip history for every way you move.</text>
  <rect x="78" y="1148" width="550" height="86" rx="10" fill="#1992ff"/>
  <text x="353" y="1202" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="900" fill="#00111e">JOIN THE GOOGLE PLAY LIST</text>
  <text x="78" y="1280" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#9fb0bd">gmode.ca</text>
</svg>
